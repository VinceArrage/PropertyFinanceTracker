[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proptrack"
version = "0.1.0"
description = "Personal finance tracker for rental and personal properties, with receipt scanning."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
proptrack = "proptrack.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proptrack = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

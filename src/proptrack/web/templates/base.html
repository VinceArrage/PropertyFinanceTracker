<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Properties">
  <meta name="theme-color" content="#1f6f5c">
  <title>{% block title %}Property Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/properties">Property Tracker</a>
    <nav>
      <a href="/properties" {% if active == "properties" %}aria-current="page"{% endif %}>Properties</a>
      <a href="/receipts" {% if active == "receipts" %}aria-current="page"{% endif %}>Receipts</a>
      <a href="/categories" {% if active == "categories" %}aria-current="page"{% endif %}>Categories</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
